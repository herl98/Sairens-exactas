<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Fondo de la página */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
}

/* Caja del login */
.login-container {
    background: white;
    padding: 40px;
    border-radius: 15px;

    width: 300px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);

    text-align: center;
}

/* Título */
.login-container h2 {
    margin-bottom: 25px;
    color: #333;
}

/* Inputs */
.login-container input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border: 1px solid #ccc;
    border-radius: 8px;

    font-size: 16px;
}

/* Botón */
.login-container button {
    width: 100%;
    padding: 12px;

    background: #4facfe;
    color: white;

    border: none;
    border-radius: 8px;

    font-size: 16px;
    cursor: pointer;

    transition: 0.3s;
}

/* Hover del botón */
.login-container button:hover {
    background: #0077ff;
}
    </style>

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <form>
            <input type="text" placeholder="Usuario" required>

            <input type="password" placeholder="Contraseña" required>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
